name: Deploy Automatico su Aruba

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install Git-FTP
      run: sudo apt-get update && sudo apt-get install -y git-ftp

    - name: Sync files via Git-FTP
      env:
        PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        git ftp push --user "${{ secrets.FTP_USERNAME }}" -p "$PASSWORD" --url "ftp://ftp.smartindustries.it/www.smartindustries.it/sew4climb/" --syncroot . --force || \
        git ftp init --user "${{ secrets.FTP_USERNAME }}" -p "$PASSWORD" --url "ftp://ftp.smartindustries.it/www.smartindustries.it/sew4climb/" --syncroot .